<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Rounded app-tile clip -->
    <clipPath id="tile">
      <rect x="6" y="6" width="244" height="244" rx="52"/>
    </clipPath>

    <!-- Deep panel background (matches installer window) -->
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%"   stop-color="#15171F"/>
      <stop offset="55%"  stop-color="#0B0C11"/>
      <stop offset="100%" stop-color="#07080C"/>
    </radialGradient>

    <!-- Gold ambient glow behind the glyph -->
    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#D4B36A" stop-opacity="0.30"/>
      <stop offset="55%"  stop-color="#D4B36A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#D4B36A" stop-opacity="0"/>
    </radialGradient>

    <!-- Core dot burst -->
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFF6DD"/>
      <stop offset="45%"  stop-color="#D4B36A"/>
      <stop offset="100%" stop-color="#8A733F" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold stroke gradient for the diamonds -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFF2D0"/>
      <stop offset="45%"  stop-color="#D4B36A"/>
      <stop offset="100%" stop-color="#7A5F2E"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softxl" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Tile -->
  <g filter="url(#drop)">
    <rect x="6" y="6" width="244" height="244" rx="52" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#tile)">
    <!-- Ambient halo -->
    <rect x="6" y="6" width="244" height="244" fill="url(#ambient)"/>

    <!-- Faint particle field -->
    <g fill="#D4B36A" opacity="0.5">
      <circle cx="54"  cy="60"  r="1.3"/>
      <circle cx="206" cy="52"  r="1.1"/>
      <circle cx="214" cy="150" r="1.4"/>
      <circle cx="44"  cy="176" r="1.2"/>
      <circle cx="188" cy="206" r="1.1"/>
      <circle cx="78"  cy="214" r="1.0"/>
    </g>
    <g fill="#FFFFFF" opacity="0.22">
      <circle cx="150" cy="40" r="1.0"/>
      <circle cx="40"  cy="112" r="0.9"/>
      <circle cx="222" cy="104" r="0.9"/>
    </g>

    <!-- Nested rotated squares (diamonds) -->
    <g transform="rotate(45 128 128)" fill="none">
      <!-- outer glow -->
      <rect x="46"  y="46"  width="164" height="164" rx="16" stroke="#D4B36A" stroke-width="10" opacity="0.18" filter="url(#softxl)"/>
      <!-- outer edge -->
      <rect x="46"  y="46"  width="164" height="164" rx="16" stroke="url(#edge)" stroke-width="4.5" opacity="0.95"/>
      <!-- middle edge -->
      <rect x="72"  y="72"  width="112" height="112" rx="12" stroke="#D4B36A" stroke-width="3"   opacity="0.6"/>
      <!-- inner edge -->
      <rect x="96"  y="96"  width="64"  height="64"  rx="9"  stroke="#D4B36A" stroke-width="2.2" opacity="0.4"/>
    </g>

    <!-- Core -->
    <circle cx="128" cy="128" r="34" fill="url(#core)" filter="url(#soft)"/>
    <circle cx="128" cy="128" r="11" fill="#FFF6DD"/>
    <circle cx="128" cy="128" r="7"  fill="#FFFFFF"/>
  </g>

  <!-- Subtle rim light -->
  <rect x="6.75" y="6.75" width="242.5" height="242.5" rx="51" fill="none" stroke="#D4B36A" stroke-width="1.5" opacity="0.22"/>
</svg>
